name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q
      - name: Clean-home CLI smoke test
        run: |
          clean_home="$(mktemp -d)"
          HOME="$clean_home" retro-2 --help
          touch "$clean_home/transcript.jsonl"
          HOME="$clean_home" retro-2 enqueue --session-id ci-smoke --transcript-path "$clean_home/transcript.jsonl"

